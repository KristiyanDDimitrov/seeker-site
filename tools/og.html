<!doctype html>
<!-- The 1200x630 share card. Rendered to assets/og.png by tools/og.py;
     not part of the site. Dark tokens from theme.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #17191C; color: #E8EAEC;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
          display: flex; flex-direction: column; justify-content: center; }
  .icon { width: 88px; margin-left: -5px; }
  .wordmark { width: 400px; margin-top: 24px; }
  p { margin: 28px 0 0; font-size: 28px; line-height: 1.3; text-wrap: balance; }
  .meta { margin-top: 20px; font-size: 20px; color: #A0A7AE; }
  /* A window onto the dashboard's playlist and status columns: the
     lamps are the product, the sidebar repeats the wordmark. */
  .frame { position: absolute; left: 600px; top: 125px; right: 0; height: 380px;
           overflow: hidden; border: 1px solid #353A40; border-right: 0;
           border-radius: 6px 0 0 6px; }
  .shot { position: absolute; width: 1240px; left: -470px; top: -166px; }
</style>
</head>
<body>
  <div class="text">
    <img class="icon" src="../assets/icon-256.png" alt="">
    <img class="wordmark" src="../assets/wordmark.svg" alt="Seeker">
    <p>Find what your DJ sets are missing, and get it into your library correctly tagged.</p>
    <div class="meta">Free for macOS · seekerapp.dev</div>
  </div>
  <div class="frame"><img class="shot" src="../assets/screens/dashboard-2560.webp" alt=""></div>
</body>
</html>
